<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer Shell with Black Background -->
  <rect x="20" y="20" width="60" height="60" rx="8" ry="8" stroke="#0057B7" stroke-width="3" fill="black"></rect>

  <!-- Inner grid simulating ports -->
  <g stroke="#00BFFF" stroke-width="1.5" fill="#00BFFF">
    <circle cx="35" cy="40" r="4"></circle>
    <circle cx="50" cy="40" r="4"></circle>
    <circle cx="65" cy="40" r="4"></circle>

    <circle cx="35" cy="55" r="4"></circle>
    <circle cx="50" cy="55" r="4"></circle>
    <circle cx="65" cy="55" r="4"></circle>
  </g>

  <!-- Label -->
  <text x="50" y="90" font-size="10" font-family="Arial" fill="#00BFFF" text-anchor="middle">FDT</text>
</svg>
