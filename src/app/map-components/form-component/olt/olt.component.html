<div class="">
 <div class="icon-title">
  <img src="assets/icons/olt.svg" alt="OLT" width="24" height="24">
  <h3 class="truncate" title="Fiber Access Terminal">OLT (Optical Line Terminal)</h3>
</div>

<br>

<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <div class="form-field">
    <label for="name">
      Name: <span class="required-star">*</span>
    </label>
    <input id="name" type="text" formControlName="name">
      <span class="error-message" *ngIf="form.get('name')?.errors?.['required'] && form.get('name')?.touched">
        Name is required
      </span>
  </div>

  <div class="form-field">
    <label for="opticalLevel">Optical Level</label>
    <select id="opticalLevel" formControlName="opticalLevel" required>
      <option value="">-- Select Optical Level --</option>
      <option value="Primary">Primary</option>
      <option value="Secondary">Secondary</option>
    </select>
  </div>

    <div class="form-field">
    <label for="upLinkProtection">Up Link Protection:</label>
    <select id="upLinkProtection" formControlName="upLinkProtection" required>
      <option value="">-- Select Up Link Protection: --</option>
      <option value="Yes">Yes</option>
      <option value="No">No</option>
    </select>
  </div>

  <ng-container *ngIf="shouldShowAccessoryFields()"> 

  <ng-container *ngFor="let field of specificationParametersDTOList">
  <div class="form-field" *ngIf="shouldShowField(field) && !field.isAccessories">
    <label>
      {{ field.paramName }}:
      <span *ngIf="form.get(field.paramName)?.hasValidator(Validators.required)" class="required-star">*</span>
    </label>

    <!-- Dropdown for MultiValue -->
    <select *ngIf="field.isMultiValueParam" [formControlName]="field.paramName">
      <option value="">-- Select --</option>
      <option *ngFor="let val of field.paramMultiValues" [value]="val">{{ val }}</option>
    </select>

    <!-- Textbox for non-MultiValue -->
    <input *ngIf="!field.isMultiValueParam" type="text" [formControlName]="field.paramName">
  </div>
</ng-container>

    <!-- Accessories FormArray -->
<div *ngIf="form.get('Type')?.value">
  <h4>Accessories for: {{ form.get('Type')?.value }}</h4>

  <!-- Single Add Row -->
  <div [formGroup]="accessoryForm" class="form-field-group">
    <div class="form-field">
      <label>Accessory:</label>
      <select formControlName="paramValue">
        <option value="">-- Select Accessory --</option>
        <option *ngFor="let val of getAccessoryValuesForType()" [value]="val">{{ val }}</option>
      </select>
    </div>

    <div class="form-field">
      <label>Quantity:</label>
      <input type="number" formControlName="quantity" min="1">
    </div>

    <div class="form-field">
      <button class="addbutton" type="button" (click)="addAccessoryToList()">+ Add</button>
    </div>
  </div>

</div>

</ng-container>

  <!-- Add Button (only one below all rows) -->
<!-- <div class="form-field mt-2">
  <button class="addbutton" type="button" (click)="addAccessoryDetail()">+ Add Accessory Field</button>
</div> -->

   
  <div class="form-field">
    <label for="powerBackup">Power Backup</label>
    <select id="powerBackup" formControlName="powerBackup" required>
      <option value="">-- Select Power Backup --</option>
      <option value="Yes">Yes</option>
      <option value="No">No</option>
    </select>
  </div>

  <!-- Coordinates Validation -->
  <div *ngIf="(form.get('longitude')?.errors?.['required'] || form.get('latitude')?.errors?.['required']) && 
               (form.get('longitude')?.touched || form.get('latitude')?.touched)" 
       class="error-message">
    Please select a location on the map
  </div>

  <div class="form-actions-wrapper">
    <div class="form-actions">
      <button type="submit" [disabled]="form.invalid" class="submit-btn">Submit</button>
      <button type="button" (click)="onCancel()" class="cancel-btn">Cancel</button>
    </div>
  </div>

    <!-- Table of Added Accessories -->
<div *ngIf="inventoryList.length > 0">
  <table class="accessory-table upgraded-table">
    <thead>
      <tr>
        <th>Type</th>
        <th>Accessory</th>
        <th>Qty</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let group of inventoryList.controls; let i = index">
        <td>{{ group.get('paramName')?.value }}</td>
        <td>{{ group.get('paramValue')?.value }}</td>
        <td>{{ group.get('quantity')?.value }}</td>
        <td>
          <!-- Only show delete if there is at least 1 row -->
          <button pButton type="button" icon="pi pi-trash"
                  class="p-button-text p-button-danger p-button-sm"
                  (click)="removeAccessoryDetail(i)">
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
</form>
</div>
