<div class="pole-form">

<div class="icon-title">
  <img 
    [src]="getPoleIconPath()" 
    [alt]="getPoleTitle()" 
    width="24" 
    height="24"
  />
  <h3 class="truncate">
    {{ getPoleTitle() }}
  </h3>
</div>


<br>
<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <!-- Name Field -->
  <div class="form-field">
    <label for="name">
      Name: <span class="required-star">*</span>
    </label>
    <input id="name" type="text" formControlName="name">
      <span class="error-message" *ngIf="form.get('name')?.errors?.['required'] && form.get('name')?.touched">
        Name is required
      </span>
  </div>

  <!-- Height Field -->
  <div class="form-field">
    <label for="heightM">
      Height (M):
       <!-- <span class="required-star">*</span> -->
      <!-- <span class="error-message">
        Please enter a valid number
      </span> -->
    </label>
    <input id="heightM" type="number" formControlName="heightM">
  </div>

  <!-- Dynamic Field: Type -->
<!-- Dynamic Specification Fields -->
 <ng-container *ngIf="shouldShowAccessoryFields()"> 
    
<ng-container *ngFor="let field of specificationParametersDTOList">
  <div class="form-field" *ngIf="!field.isAccessories && shouldShowField(field)">
    <label>
      {{ field.paramName }}:
      <span *ngIf="form.get(field.paramName)?.hasValidator(Validators.required)" class="required-star">*</span>
    </label>

    <!-- Dropdown if MultiValue -->
    <select *ngIf="field.isMultiValueParam" [formControlName]="field.paramName">
      <option value="">-- Select --</option>
      <option *ngFor="let val of field.paramMultiValues" [value]="val">{{ val }}</option>
    </select>

    <!-- Textbox if not MultiValue -->
    <input *ngIf="!field.isMultiValueParam" type="text" [formControlName]="field.paramName">
  </div>
</ng-container>


<!-- First Dropdown (Accessory Category) -->

<!-- Dynamic Accessory Details FormArray -->
<!-- New Accessory Section (Single Row + Table) -->
<div [formGroup]="accessoryForm" class="form-field-group">
  <div class="form-field">
    <label>Accessory Category</label>
    <select formControlName="paramName" (change)="onSingleAccessoryFieldChanged()">
      <option value="">-- Select Category --</option>
      <option *ngFor="let cat of accessoryCategoryList" [value]="cat">{{cat}}</option>
    </select>
  </div>

  <div class="form-field">
    <label>Accessory Value</label>
    <select formControlName="paramValue">
      <option value="">-- Select Value --</option>
      <option *ngFor="let val of singleAccessoryValues" [value]="val">{{ val }}</option>
    </select>
  </div>

  <div class="form-field">
    <label>Qty</label>
    <input type="number" formControlName="quantity">
  </div>

  <div class="form-field">
    <button class="addbutton" type="button" [disabled]="accessoryForm.invalid" (click)="addAccessoryToList()">+ Add Accessory Field</button>

  </div>
</div>

<!-- Display Table -->
<!-- Accessory List Table shown outside form -->
<table class="accessory-table upgraded-table" *ngIf="inventoryList.length > 0">
  <thead>
    <tr>
      <th>Category</th>
      <th>Value</th>
      <th>Qty</th>
      <th>Action</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let fg of inventoryList.controls; let i = index">
      <td>{{ fg.get('paramName')?.value }}</td>
      <td>{{ fg.get('paramValue')?.value }}</td>
      <td>{{ fg.get('quantity')?.value }}</td>
      <td>
        <button pButton icon="pi pi-trash" class="p-button-text p-button-danger p-button-sm"
          (click)="removeAccessoryDetail(i)"></button>
      </td>
    </tr>
  </tbody>
</table>
