<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <div class="form-field">
    <label for="name">Name:</label>
    <input id="name" type="text" formControlName="name" required>
  </div>

  <div class="form-field">
    <label for="capacity">Capacity:</label>
    <input id="capacity" type="number" formControlName="capacity" required>
  </div>

  <div class="form-field">
    <label for="address">Address:</label>
    <input id="address" type="text" formControlName="address" required>
  </div>

  <div class="form-field">
    <label for="status">Status:</label>
    <select id="status" formControlName="status" required>
      <option value="">-- Select status --</option>
      <option value="InService">In Service</option>
      <option value="Planned">Planned</option>
    </select>
  </div>

  <div class="form-field">
    <label for="parentNeType">Parent Type</label>
    <select id="parentNeType" formControlName="parentNeType" required>
      <option value="Handhold">Handhold</option>
      <option value="Manhole">Manhole</option>
      <option value="Pole">Pole</option>
    </select>
  </div>

  <button type="submit" [disabled]="form.invalid">Submit</button>
</form>
