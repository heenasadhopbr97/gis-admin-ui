<div class="building-form">
  
<div class="icon-title">
  <img 
    [src]="getBuildingIconPath()" 
    [alt]="buildingType" 
    width="24" 
    height="24"
  />

  <h3 class="truncate" [attr.title]="getBuildingTitle()">
    {{ getBuildingTitle() }}
  </h3>
</div>
<br>

  <!-- Common form fields go here -->
<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <!-- Name Field -->
  <div class="form-field">
    <label for="name">
      Name: <span class="required-star">*</span>
    </label>
    <input id="name" type="text" formControlName="name">
    <span class="error-message" *ngIf="form.get('name')?.errors?.['required'] && form.get('name')?.touched">
        Name is required
    </span>
  </div>

  <!-- Address Field -->
  <div class="form-field">
    <label for="address">Address:</label>
    <input id="address" type="text" formControlName="address">
  </div>

 <!-- Home Passes Field -->
<div class="form-field">
  <label for="homePasses">
    Home Passes: <span class="required-star">*</span>
  </label>
  <input id="homePasses" type="number" formControlName="homePasses" (keypress)="numericOnly($event)">
  <span class="error-message" *ngIf="form.get('homePasses')?.errors?.['pattern']">
    Please enter numbers only
  </span>
</div>

<!-- Floors Field -->
<div class="form-field">
  <label for="floors">Floors:
    <span class="required-star">*</span>
  </label>
  <input id="floors" type="number" formControlName="floors" (keypress)="numericOnly($event)">
  <span class="error-message" *ngIf="form.get('floors')?.errors?.['pattern']">
    Please enter numbers only
  </span>
</div>

<!-- Towers Field -->
<div class="form-field">
  <label for="towers">Towers:
    <span class="required-star">*</span>
  </label>
  <input id="towers" type="number" formControlName="towers" (keypress)="numericOnly($event)">
  <span class="error-message" *ngIf="form.get('towers')?.errors?.['pattern']">
    Please enter numbers only
  </span>
</div>


  <!-- Tenancy Field -->
  <div class="form-field">
    <label for="tenancy">
      Tenancy:
       <!-- <span class="required-star">*</span> -->
    </label>
    <select id="tenancy" formControlName="tenancy">
      <option value="">-- Select tenancy --</option>
      <option value="Owned">Owned</option>
      <option value="Rented">Rented</option>
    </select>
    <!-- <span class="error-message" *ngIf="form.get('tenancy')?.errors?.['require']">
      Tenancy is required
    </span> -->
  </div>

  <!-- Category Field -->
  <div class="form-field">
    <label for="category">
      Category: 
      <!-- <span class="required-star">*</span> -->
    </label>
    <select id="category" formControlName="category">
      <option value="">-- Select category --</option>
      <option value="Residential">Residential</option>
      <option value="Commercial">Commercial</option>
      <option value="MixedUse">Mixed Use</option>
    </select>
    <!-- <span class="error-message" *ngIf="form.get('category')?.errors?.['require']">
      Category is required
    </span> -->
  </div>

  <div class="form-field">
    <label for="streetName">Street Name</label>
    <input id="streetName" type="text" formControlName="streetName">
  </div>

  <div class="form-field">
    <label for="opticalLevel">Optical Level</label>
    <input id="opticalLevel" type="text" formControlName="opticalLevel">
  </div>

  <div class="form-field">
    <label for="riser">Riser</label>
    <input id="riser" type="text" formControlName="riser">
  </div>

  <div class="form-field">
    <label for="photo1">Photo 1</label>
    <input id="photo1" type="file" formControlName="photo1">
  </div>
  
  <div class="form-field">
    <label for="photo2">Photo 2</label>
    <input id="photo2" type="file" formControlName="photo2">
  </div>

  <div class="form-field">
    <label for="remarks">Remarks</label>
    <input id="remarks" type="text" formControlName="remarks">
    <!-- <span class="error-message" *ngIf="form.get('remarks')?.errors?.['pattern']">
      Remarks is required
    </span> -->
  </div>

  <!-- Coordinates Validation -->
  <div *ngIf="(form.get('longitude')?.errors?.['required'] || form.get('latitude')?.errors?.['required']) && 
               (form.get('longitude')?.touched || form.get('latitude')?.touched)" 
       class="error-message">
    Please select a location on the map
  </div>

  <div class="form-actions-wrapper">
    <div class="form-actions">
      <button type="submit" [disabled]="form.invalid" class="submit-btn">Submit</button>
      <button type="button" (click)="onCancel()" class="cancel-btn">Cancel</button>
    </div>
  </div>

</form>
