<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <div class="form-field">
    <label for="name">Name:</label>
    <input id="name" type="text" formControlName="name" required>
  </div>

  <div class="form-field">
    <label for="address">Address:</label>
    <input id="address" type="text" formControlName="address" required>
  </div>

  <div class="form-field">
    <label for="port">Port:</label>
    <input id="port" type="number" formControlName="port" required>
  </div>

  <div class="form-field">
    <label for="customerType">Customer Type:</label>
    <select id="customerType" formControlName="customerType" required>
      <option value="">-- Select type --</option>
      <option value="Residential">Residential</option>
      <option value="Enterprise">Enterprise</option>
      <option value="SMB">SMB</option>
    </select>
  </div>

  <div class="form-field">
    <label for="status">Status</label>
    <select id="status" formControlName="status" required>
      <option value="">-- Select type --</option>
      <option value="InService">InService</option>
      <option value="Planned">Planned</option>
      <option value="Inactive">Inactive</option>
    </select>
  </div>

  <div class="form-field">
    <label for="parentType">Parent Type</label>
    <select id="parentType" formControlName="parentType" required>
      <option value="Handhold">Handhold</option>
      <option value="Manhole">Manhole</option>
      <option value="Pole">Pole</option>
    </select>
  </div>

   <div class="form-field">
    <label for="activationDate">Activation Date:</label>
    <input id="activationDate" type="date" formControlName="activationDate">
  </div>
  
  <button type="submit" [disabled]="form.invalid">Submit</button>
</form>
