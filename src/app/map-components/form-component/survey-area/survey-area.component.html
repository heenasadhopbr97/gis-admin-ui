<h3>Survey area</h3>

<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <!-- Name Field -->
  <div class="form-field">
    <label for="name">
      Name: <span class="required-star">*</span>
    </label>
    <input id="name" type="text" formControlName="name">
    <span class="error-message" *ngIf="form.get('name')?.errors?.['required'] && form.get('name')?.touched">
      Name is required
    </span>
  </div>

  <!-- Description Field -->
  <div class="form-field">
    <label for="description">Description:</label>
    <textarea id="description" formControlName="description"></textarea>
  </div>

  <!-- Survey Status Field -->
  <div class="form-field">
    <label for="surveyStatusId">
      Survey Status Type: <span class="required-star">*</span>
        </label>
      <select id="surveyStatusId" formControlName="surveyStatusId">
        <option value="">-- Select type --</option>
        <option *ngFor="let survey of surveyStatus" [value]="survey.id">
          {{ survey.name }}
        </option>
      </select>
      <span class="error-message" *ngIf="form.get('surveyStatusId')?.errors?.['required'] && form.get('surveyStatusId')?.touched">
        Survey status is required
      </span>
  </div>
  

  <!-- Survey Start Date -->
  <div class="form-field">
    <label for="surveyStartDate">
      Survey Start Date: 
      <!-- <span class="required-star">*</span> -->
    </label>
    <input id="surveyStartDate" type="date" formControlName="surveyStartDate">
    <!-- <span class="error-message" *ngIf="form.get('surveyStartDate')?.errors?.['required'] && form.get('surveyStartDate')?.touched">
      Start date is required
    </span> -->
  </div>

  <!-- Survey End Date -->
  <div class="form-field">
    <label for="surveyEndDate">
      Survey End Date: 
      <!-- <span class="required-star">*</span> -->
    </label>
    <input id="surveyEndDate" type="date" formControlName="surveyEndDate">
    <!-- <span class="error-message" *ngIf="form.get('surveyEndDate')?.errors?.['required'] && form.get('surveyEndDate')?.touched">
      End date is required
    </span> -->
  </div>

  <!-- Status Field -->
  <div class="form-field">
    <label>
      Status: <span class="required-star">*</span>
      <span class="error-message" *ngIf="form.get('isActive')?.errors?.['required'] && form.get('isActive')?.touched">
        Status is required
      </span>
    </label>
    <div>
      <label>
        <input type="radio" formControlName="isActive" [value]="true"> Active
      </label>
      <label style="margin-left:15px">
        <input type="radio" formControlName="isActive" [value]="false"> In-active
      </label>
    </div>
  </div>

  <!-- Geometry Field (hidden but validated) -->
  <div *ngIf="form.get('geom')?.errors?.['required'] && form.get('geom')?.touched" class="error-message">
    Please draw an area on the map
  </div>

  <button type="submit" [disabled]="form.invalid">Submit</button>
</form>
