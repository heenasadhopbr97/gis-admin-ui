<div class="nearby-elements-popup" [class.visible]="visible">
  <div class="popup-overlay" (click)="onClose()"></div>
  
  <div class="popup-content">
    <div class="popup-header">
      <h3>Nearby Network Elements</h3>
      <button class="close-btn" (click)="onClose()">×</button>
    </div>

    <div class="popup-body">
      <!-- Loading state -->
      <div *ngIf="isLoading" class="loading-state">
        <div class="spinner"></div>
        <p>Loading nearby elements...</p>
      </div>

      <!-- No elements state -->
      <div *ngIf="!isLoading && nearbyElements.length === 0" class="empty-state">
        <p>No nearby elements found</p>
      </div>

      <!-- Elements list -->
      <div *ngIf="!isLoading && nearbyElements.length > 0" class="elements-list">
        <div *ngFor="let type of Object.keys(groupedElements)" class="element-type-group">
          <h4 class="group-header">{{ getTypeDisplayName(type) }}</h4>
          
          <div *ngFor="let element of groupedElements[type]" 
               class="element-item" 
               (click)="onElementSelect(element)">
            
            <div class="element-icon">
              <img [src]="getElementIcon(element.layername)" 
                   [alt]="getTypeDisplayName(element.layername)"
                   class="element-icon-img">
            </div>
            
            <div class="element-info">
              <div class="element-name">{{ element.name }}</div>
              <div class="element-id">ID: {{ element.id }}</div>
              <div class="element-coordinates">
                Coordinates: {{ getCoordinates(element) }}
              </div>
              <div *ngIf="element.mvnoId" class="element-mvno">
                MVNO ID: {{ element.mvnoId }}
              </div>
            </div>
            
            <div class="select-indicator">
              <i class="fas fa-chevron-right"></i>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
