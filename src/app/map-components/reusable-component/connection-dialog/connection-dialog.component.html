  <div class="w-full flex justify-content-center mt-4">

          </div>
          <div class="info-row">
            <span class="info-label">Power Levels:</span>

        </div>
      </div>

    </div>
  </div>

    </div>
  </div>

        [surveyAreaId]="selectedSurveyAreaId"  [parentNeId]="fatId" (formSubmit)="onSplitterCreated($event)">
      </app-splitter>

          <!-- Survey Area Status -->
          <div *ngIf="surveyStageName" class="mb-2">
            <p><strong>Survey Area Status:</strong> {{ surveyStageName }}</p>

<!-- Network Type Dropdown (only once) -->
<div class="flex gap-3 w-full mb-3">
  <div class="flex-1">
    <label for="neType">Select Network Type:</label>
    <p-dropdown
      inputId="neType"
      [options]="neTypeOptions"
      [(ngModel)]="selectedNeType"
      [showClear]="true"
      placeholder="Select Type"
      optionLabel="label"
      optionValue="value"
      styleClass="w-full"
      appendTo="body"
      (onChange)="onNeTypeChanged()">
    </p-dropdown>
  </div>

<!-- Only for CDU/MDU -->
<div class="flex-1" *ngIf="selectedNeType !== 'SDU'">
  <label>Select Nearby Element:</label>
  <p-dropdown
    [options]="nearbySdus"
    [(ngModel)]="selectedNeId"
    [showClear]="true"
    placeholder="Select Network Element"
    optionLabel="name"
    optionValue="id"
    styleClass="w-full"
    appendTo="body"
    [virtualScroll]="true"
    [itemSize]="40"
    (onChange)="onNeSelected($event.value, 0)">
  </p-dropdown>
</div>

</div>

<!-- Connection rows: only ports + home pass -->
<div *ngFor="let conn of connections; let i = index" class="flex gap-3 w-full mb-2">
  <div class="flex-1">
    <label>Select Splitter Port:</label>
    <p-dropdown
      [options]="getAvailablePortsForRow(i)"
      [(ngModel)]="connections[i].portNumber"
      [showClear]="true"
      placeholder="Select Port"
      optionLabel="portNumber"
      optionValue="portNumber"
      styleClass="w-full"
      appendTo="body"
      [virtualScroll]="true"
      [itemSize]="40">
    </p-dropdown>
  </div>

  <!-- Only for SDU -->
  <div class="flex-1" *ngIf="selectedNeType === 'SDU'">
    <label>Select SDU:</label>
    <p-dropdown
      [options]="getAvailableSdusForRow(i)"
      [(ngModel)]="connections[i].sduId"
      [showClear]="true"
      placeholder="Select SDU"
      optionLabel="name"
      optionValue="id"
      styleClass="w-full"
      appendTo="body"
      [virtualScroll]="true"
      [itemSize]="40">
    </p-dropdown>
  </div>

  <!-- Only for CDU/MDU -->
  <div class="flex-1" *ngIf="selectedNeType !== 'SDU'">
    <label>Select Home Pass:</label>
    <p-dropdown
      [options]="getAvailableHomePassesForRow(i)"
      [(ngModel)]="connections[i].homePassesId"
      [showClear]="true"
      placeholder="Select Home Pass"
      optionLabel="name"
      optionValue="id"
      styleClass="w-full"
      appendTo="body"
      [virtualScroll]="true"
      [itemSize]="40">
    </p-dropdown>
  </div>

  <div class="flex align-items-center">
    <button pButton icon="pi pi-trash" class="p-button-danger p-button-rounded mt-5"
      (click)="removeConnectionRow(i)" *ngIf="connections.length > 1"></button>
  </div>
</div>


          <p-button label="+ Add" (onClick)="addConnectionRow()" [disabled]="!canAddConnection()" class="p-button-secondary"></p-button>

        </div>
      </div>
        <!-- </ng-container> -->
      <!-- </ng-container> -->
    </div>
  </div>

  <div class="flex justify-content-end mt-4">
  <p-button label="Connectivity" icon="pi pi-link" (onClick)="onConnectivityClick()" class="p-button-success"></p-button>
