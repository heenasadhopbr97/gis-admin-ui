<div class="vertical-icons" style="float: right; box-shadow: 0 0 0 2px rgba(0, 0, 0, .1);">
  <button (click)="startDrawing('Point')" title="Draw Point"  [class.active]="currentDrawingMode === 'Point'"
  *ngIf="hasNetworkCreatePermission">
    <!-- <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20">
      <path d="m10 2c-3.3 0-6 2.7-6 6s6 9 6 9 6-5.7 6-9-2.7-6-6-6zm0 2c2.1 0 3.8 1.7 3.8 3.8 0 1.5-1.8 3.9-2.9 5.2h-1.7c-1.1-1.4-2.9-3.8-2.9-5.2-.1-2.1 1.6-3.8 3.7-3.8z" />
    </svg> -->
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10" fill="white" stroke="black" stroke-width="2" />
      <line x1="12" y1="8" x2="12" y2="16" stroke="black" stroke-width="2" />
      <line x1="8" y1="12" x2="16" y2="12" stroke="black" stroke-width="2" />
    </svg>
  </button>
  <button (click)="startDrawing('LineString')" title="Draw Line"  [class.active]="currentDrawingMode === 'LineString'"
  *ngIf="hasNetworkCreatePermission">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20">
      <path d="m13.5 3.5c-1.4 0-2.5 1.1-2.5 2.5 0 .3 0 .6.2.9l-3.8 3.8c-.3-.1-.6-.2-.9-.2-1.4 0-2.5 1.1-2.5 2.5s1.1 2.5 2.5 2.5 2.5-1.1 2.5-2.5c0-.3 0-.6-.2-.9l3.8-3.8c.3.1.6.2.9.2 1.4 0 2.5-1.1 2.5-2.5s-1.1-2.5-2.5-2.5z" />
    </svg>
  </button>
  <button *ngIf="hasSurveyCreatePermission" (click)="startDrawing('Polygon')" [class.active]="currentDrawingMode === 'Polygon'" title="Create survey">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24">
      <path d="M12 2L2 7v10l10 5 10-5V7L12 2zm0 2.8L20 9v6l-8 4-8-4V9l8-4.2z" />
    </svg>
  </button>
  <button (click)="onClearDrawings()" title="Clear Drawings">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20">
      <path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41z" />
    </svg>
  </button>
</div>
