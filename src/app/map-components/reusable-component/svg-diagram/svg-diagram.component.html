<div class="svg-diagram-container">
  <div class="header">
    <h2>SVG Fiber Network Diagram</h2>
    <p>Network Type: {{ currentNetworkType }}</p>
  </div>

  <div class="zoom-controls">
    <button (click)="zoomIn()" class="zoom-btn" title="Zoom In">
      <span>+</span>
    </button>
    <button (click)="zoomOut()" class="zoom-btn" title="Zoom Out">
      <span>−</span>
    </button>
    <button (click)="resetView()" class="zoom-btn reset-btn" title="Reset View">
      <span>⌂</span>
    </button>
  </div>

  <div class="svg-container" #svgContainer>
  </div>

  <div class="footer">
    <p>Use mouse wheel to zoom, drag to pan, double-click to reset</p>
  </div>
</div>
